<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-hidden="true">
  <rect width="520" height="300" fill="#e8ebf0"/>
  <!-- ledger sheet -->
  <rect x="40" y="34" width="330" height="232" fill="#ffffff" stroke="#c9d0da"/>
  <rect x="40" y="34" width="330" height="30" fill="#1c2a44"/>
  <rect x="56" y="45" width="90" height="8" fill="#c6d0e0"/>
  <rect x="300" y="45" width="54" height="8" fill="#c6d0e0"/>
  <!-- ruled rows: date | code | amount -->
  <g stroke="#e1e5eb">
    <line x1="40" x2="370" y1="96" y2="96"/><line x1="40" x2="370" y1="128" y2="128"/>
    <line x1="40" x2="370" y1="160" y2="160"/><line x1="40" x2="370" y1="192" y2="192"/>
    <line x1="40" x2="370" y1="224" y2="224"/>
  </g>
  <g fill="#d3d9e2">
    <rect x="56" y="76" width="44" height="7"/><rect x="56" y="108" width="44" height="7"/>
    <rect x="56" y="140" width="44" height="7"/><rect x="56" y="172" width="44" height="7"/>
    <rect x="56" y="204" width="44" height="7"/><rect x="56" y="236" width="44" height="7"/>
  </g>
  <g fill="#1c2330">
    <rect x="300" y="76" width="54" height="7"/><rect x="310" y="108" width="44" height="7"/>
    <rect x="296" y="140" width="58" height="7"/><rect x="316" y="172" width="38" height="7"/>
    <rect x="304" y="204" width="50" height="7"/><rect x="310" y="236" width="44" height="7"/>
  </g>
  <!-- parsed code tags -->
  <g fill="#1f5da8"><rect x="120" y="72" width="64" height="15"/><rect x="120" y="136" width="64" height="15"/><rect x="120" y="200" width="64" height="15"/></g>
  <g fill="#ffffff" fill-opacity=".9"><rect x="128" y="77" width="48" height="5"/><rect x="128" y="141" width="48" height="5"/><rect x="128" y="205" width="48" height="5"/></g>
  <!-- the one row nobody could match -->
  <rect x="120" y="104" width="64" height="15" fill="none" stroke="#b9770e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="120" y="168" width="64" height="15" fill="none" stroke="#b9770e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- bar summary -->
  <rect x="396" y="34" width="84" height="232" fill="#ffffff" stroke="#c9d0da"/>
  <rect x="410" y="180" width="16" height="68" fill="#1f5da8"/>
  <rect x="432" y="130" width="16" height="118" fill="#1f5da8"/>
  <rect x="454" y="206" width="16" height="42" fill="#b9770e"/>
  <line x1="406" x2="470" y1="248" y2="248" stroke="#1c2330"/>
</svg>
